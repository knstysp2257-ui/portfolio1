<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>예십추크 콘스탄틴 — Portfolio (Prototype)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
:root{
  --bg:#faf8ff; --surface:#ffffff; --soft:#f1ecff;
  --fg:#16131f; --muted:#6c6680; --line:#e6e0f5;
  --lavender:#b9a7f5; --violet:#7c4dff; --sky:#7cc6ff; --black:#16131f;
  --grad:linear-gradient(135deg,#b9a7f5 0%,#7cc6ff 100%);
  --r:24px; --shadow:0 10px 30px -12px rgba(76,48,160,.18);
  --gutter:clamp(16px,4vw,48px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0d16; --surface:#1a1724; --soft:#221d33; --fg:#efeaff; --muted:#a39cbb; --line:#2d2840;
  --violet:#a487ff; --shadow:0 10px 30px -12px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --bg:#0f0d16; --surface:#1a1724; --soft:#221d33; --fg:#efeaff; --muted:#a39cbb; --line:#2d2840;
  --violet:#a487ff; --shadow:0 10px 30px -12px rgba(0,0,0,.6);}

*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;word-break:keep-all;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none} h1,h2,h3,p{margin:0} ul{list-style:none;margin:0;padding:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--gutter)}

/* proto banner */
.proto{background:var(--black);color:#fff;text-align:center;font-size:13px;padding:8px 16px}
:root[data-theme="dark"] .proto{background:var(--violet)}

/* nav */
.nav{position:sticky;top:0;z-index:10;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 75%,transparent);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font-weight:700;display:flex;align-items:center;gap:10px}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.links{display:flex;gap:24px;font-size:15px;color:var(--muted)} .links a:hover{color:var(--violet)}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--surface);color:var(--violet);box-shadow:0 2px 8px -2px rgba(0,0,0,.15)}
.theme{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px}

/* hero */
.hero{padding:clamp(48px,9vh,110px) 0 clamp(56px,10vh,120px);position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;z-index:-1}
.b1{width:420px;height:420px;background:var(--lavender);top:-60px;right:-80px}
.b2{width:320px;height:320px;background:var(--sky);bottom:-40px;left:-100px;opacity:.4}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:center}
.hi{color:var(--muted);font-size:18px;margin-bottom:8px}
.name{font-size:clamp(38px,6vw,68px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.word{display:inline-block;margin-top:14px;font-size:clamp(20px,2.6vw,28px);font-weight:700;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.desc{margin-top:18px;font-size:18px;color:var(--muted);max-width:34ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
.ctas{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:999px;font-weight:600;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.main{background:var(--black);color:#fff;box-shadow:var(--shadow)}
:root[data-theme="dark"] .btn.main{background:var(--violet)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.main{background:var(--violet)}}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.photo{aspect-ratio:4/5;border-radius:32px;background:var(--grad);position:relative;overflow:hidden;box-shadow:var(--shadow);
  display:grid;place-items:center;color:#fff}
.photo::before{content:"";position:absolute;width:55%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.25);top:18%}
.photo::after{content:"";position:absolute;width:85%;height:40%;border-radius:50% 50% 0 0;background:rgba(255,255,255,.25);bottom:-6%}
.photo span{position:absolute;bottom:16px;left:16px;font-size:12px;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px}

/* sections */
section.s{padding:clamp(64px,11vh,120px) 0}
.kicker{font-size:14px;font-weight:700;color:var(--violet);letter-spacing:.04em}
.title{font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.025em;margin-top:6px}
.sub{color:var(--muted);margin-top:10px;max-width:56ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;box-shadow:var(--shadow)}

/* about */
.about-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin-top:40px}
.story p+p{margin-top:14px} .story p{font-size:17px}
.why{background:var(--grad);color:#16131f;border:0}
.why h3{font-size:15px;opacity:.75} .why p{font-size:19px;font-weight:600;margin-top:10px}
.strengths{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}
.st .ico{width:48px;height:48px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:22px;margin-bottom:16px}
.st h3{font-size:20px} .st p{color:var(--muted);margin-top:8px}
.st.empty{border-style:dashed;box-shadow:none;background:transparent;display:grid;place-items:center;text-align:center;color:var(--muted)}

/* experience */
.exp{display:grid;gap:24px;margin-top:40px}
.case{display:grid;grid-template-columns:300px 1fr;gap:28px;padding:20px}
.thumb{border-radius:18px;background:var(--soft);min-height:220px;position:relative;overflow:hidden}
.thumb::before{content:"";position:absolute;inset:18%;border-radius:14px;background:var(--grad);opacity:.6;transform:rotate(-6deg)}
.thumb span{position:absolute;bottom:12px;left:12px;font-size:12px;background:var(--surface);padding:3px 10px;border-radius:999px;color:var(--muted)}
.meta{font-size:14px;color:var(--muted)} .case h3{font-size:24px;margin:4px 0 6px}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.role{background:var(--soft);color:var(--violet);font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.flow div{background:var(--bg);border-radius:14px;padding:14px;font-size:14px}
.flow b{display:block;font-size:12px;color:var(--violet);margin-bottom:4px}
.edu{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.edu h3{font-size:19px;margin-top:4px}

/* skills */
.skills-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin-top:40px}
.lng+.lng{margin-top:22px}
.lng-top{display:flex;justify-content:space-between;font-weight:600}
.lng-top span{color:var(--muted);font-weight:500;font-size:14px}
.bar{height:10px;border-radius:999px;background:var(--soft);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--grad);width:0;transition:width 1.2s cubic-bezier(.2,.7,.1,1)}
.goal{margin-top:6px;font-size:13px;color:var(--violet);font-weight:600}
.note{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.sk{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.sk li{padding:10px 16px;border-radius:14px;background:var(--soft);font-weight:500}

/* contact */
.contact{text-align:center;background:var(--black);color:#fff;border-radius:36px;padding:clamp(48px,8vw,88px) 24px;position:relative;overflow:hidden}
.contact .blob{z-index:0} .contact > *{position:relative}
.contact .title{color:#fff} .contact .sub{color:#c9c2e0;margin:12px auto 0}
.contact .btn{background:#fff;color:#16131f;margin-top:28px}
.loc{margin-top:16px;color:#a39cbb;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:40px 0}

/* reveal */
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s} .rv.in{opacity:1;transform:none}

@media (max-width:860px){
  .links{display:none}
  .hero .wrap,.about-grid,.skills-grid,.case,.edu{grid-template-columns:1fr}
  .photo{max-width:320px;order:-1}
  .strengths,.flow{grid-template-columns:1fr}
  .thumb{min-height:180px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.rv{opacity:1;transform:none}}
</style>

function setLang(l){
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(el=>{const v=T[l][el.dataset.i];if(v!==undefined)el.innerHTML=v});
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  try{localStorage.setItem('lang',l)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let saved='ko';try{saved=localStorage.getItem('lang')||'ko'}catch(e){}
setLang(T[saved]?saved:'ko');

document.querySelector('.theme').onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}
};

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){
  e.target.classList.add('in');e.target.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
</script>
