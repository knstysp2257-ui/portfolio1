<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 예십추크 콘스탄틴</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23b9a7f5'/%3E%3Cstop offset='1' stop-color='%237cc6ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='system-ui,sans-serif' font-size='28' font-weight='700' fill='%2316131f' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#faf8ff; --surface:#ffffff; --soft:#f1ecff;
  --fg:#16131f; --muted:#6c6680; --line:#e6e0f5;
  --lavender:#b9a7f5; --violet:#7c4dff; --sky:#7cc6ff; --black:#16131f;
  --grad:linear-gradient(135deg,#b9a7f5 0%,#7cc6ff 100%);
  --r:24px; --shadow:0 10px 30px -12px rgba(76,48,160,.18);
  --gutter:clamp(16px,4vw,48px);
  --btn:#16131f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0d16; --surface:#1a1724; --soft:#221d33; --fg:#efeaff; --muted:#a39cbb; --line:#2d2840;
  --violet:#a487ff; --shadow:0 10px 30px -12px rgba(0,0,0,.6); --btn:#7c4dff;}}
:root[data-theme="dark"]{
  --bg:#0f0d16; --surface:#1a1724; --soft:#221d33; --fg:#efeaff; --muted:#a39cbb; --line:#2d2840;
  --violet:#a487ff; --shadow:0 10px 30px -12px rgba(0,0,0,.6); --btn:#7c4dff;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;word-break:keep-all;
  display:grid;place-items:center;padding:32px var(--gutter);position:relative}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;z-index:-1;pointer-events:none}
.b1{width:min(420px,80vw);height:min(420px,80vw);background:var(--lavender);top:-80px;right:-100px}
.b2{width:min(320px,70vw);height:min(320px,70vw);background:var(--sky);bottom:-60px;left:-100px;opacity:.4}
main{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:32px;
  box-shadow:var(--shadow);padding:clamp(28px,6vw,48px);text-align:center}
.code{font-size:clamp(64px,18vw,112px);font-weight:800;letter-spacing:-.04em;line-height:1;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
h1{font-size:clamp(22px,5vw,28px);font-weight:800;letter-spacing:-.02em;margin:18px 0 8px}
p{margin:0;color:var(--muted)}
.alt{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;display:grid;gap:4px}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:28px;padding:14px 24px;border-radius:999px;
  background:var(--btn);color:#fff;font-weight:600;text-decoration:none;box-shadow:var(--shadow);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
a:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>
<script>
  /* Apply saved theme (same key family as main site; ignore if unavailable). */
  try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}
</script>
</head>
<body>
<div class="blob b1" aria-hidden="true"></div>
<div class="blob b2" aria-hidden="true"></div>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 없는 페이지예요.</p>
  <div class="alt">
    <p lang="ru">Страница не найдена.</p>
    <p lang="en">Page not found.</p>
  </div>
  <a class="btn" id="home" href="index.html">← 홈으로 · На главную · Home</a>
</main>
<script>
  /* On GitHub Pages this file is served for any missing path, so a relative link may
     point to a non-existent folder. Use the project root there; keep "index.html" for file://. */
  (function(){
    if (location.hostname.slice(-10) === "github.io") {
      document.getElementById("home").setAttribute("href", "/portfolio1/");
    }
  })();
</script>
</body>
</html>
